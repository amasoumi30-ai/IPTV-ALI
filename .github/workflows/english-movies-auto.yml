name: Build English Movies Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: '25 3 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build playlist
        run: python scripts/build_english_movies.py
      - name: Commit playlist when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add english-movies-auto.m3u
          git diff --cached --quiet && exit 0
          git commit -m "Update English movies playlist"
          git push
