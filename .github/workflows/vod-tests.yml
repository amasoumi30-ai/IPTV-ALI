name: VOD portal tests
on:
  pull_request:
    paths:
      - "vod/**"
      - "tests/test_portal.py"
      - ".github/workflows/vod-tests.yml"
  push:
    branches:
      - "feature/vod-movies-series-20261023"
    paths:
      - "vod/**"
      - "tests/test_portal.py"
      - ".github/workflows/vod-tests.yml"

jobs:
  unittest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -p test_portal.py -v
