name: Build World Sports Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: '40 3 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build world sports playlist
        run: python scripts/build_world_sports.py
      - name: Commit playlist when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world-sports-auto.m3u
          git diff --cached --quiet && exit 0
          git commit -m "Update world sports playlist"
          git push
